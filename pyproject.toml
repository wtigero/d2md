[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "d2md"
version = "0.1.2"
description = "Local document-to-Markdown conversion with Thai-aware text extraction and OCR"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "wtigero" }]
keywords = ["markdown", "pdf", "ocr", "thai", "docling", "markitdown", "rag"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Natural Language :: Thai",
]
dependencies = [
  "markitdown[docx,xlsx,pptx]>=0.1",
  "xlrd>=2,<3",
  "olefile>=0.47,<1",
  "pypdfium2>=5,<6",
]

[project.optional-dependencies]
ocr = [
  "pillow>=10",
  "ocrmac>=1,<2; sys_platform == 'darwin'",
  "rapidocr>=3,<4; sys_platform != 'darwin'",
  "numpy>=1.24; sys_platform != 'darwin'",
]
docling = [
  "pillow>=10",
  "ocrmac>=1,<2; sys_platform == 'darwin'",
  "rapidocr>=3,<4; sys_platform != 'darwin'",
  "numpy>=1.24; sys_platform != 'darwin'",
  "docling>=2.119,<3",
  "transformers<5.15",
]
benchmark = ["psutil>=5.9"]
dev = [
  "pytest>=8",
  "tomli>=2; python_version < '3.11'",
  "reportlab>=4",
  "pillow>=10",
  # Writes the .docx example. markitdown reads .docx through mammoth and never
  # pulls this in, so without it the example generator fails on a bare .[dev].
  "python-docx>=1,<2",
  "xlwt>=1.3,<2",
]

[project.scripts]
d2md = "d2md.cli:main"

[project.urls]
Homepage = "https://github.com/wtigero/d2md"
Repository = "https://github.com/wtigero/d2md"
Issues = "https://github.com/wtigero/d2md/issues"
Changelog = "https://github.com/wtigero/d2md/blob/main/CHANGELOG.md"
Security = "https://github.com/wtigero/d2md/security/policy"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.claude",
  "/.github",
  "/.superpowers",
  "/.worktrees",
  "/docs/superpowers",
]

[tool.hatch.build.targets.wheel]
packages = ["src/d2md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
